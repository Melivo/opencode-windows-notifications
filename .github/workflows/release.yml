name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install locked dependencies
        run: mise run install
      - name: Validate package
        run: mise run verify
      - name: Verify release tag
        shell: pwsh
        run: |
          $version = (Get-Content packages/opencode-windows-notifications/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match package version v$version." }
      - name: Validate publish contents
        run: mise run pack
      - name: Publish to npm
        shell: pwsh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NPM_TOKEN)) { throw 'Set the NPM_TOKEN repository secret before creating a release tag.' }
          Set-Location packages/opencode-windows-notifications
          npm publish --access public
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
