name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install locked dependencies
        run: mise run install
      - name: Typecheck, build, and source coverage
        run: mise run verify
      - name: Install OpenCode
        run: |
          winget install --exact --id SST.opencode --version 1.18.16 --source winget --accept-package-agreements --accept-source-agreements
          $version = opencode --version
          if ($version -ne '1.18.16') { throw "Expected OpenCode 1.18.16, got $version." }
      - name: Download Process Monitor
        run: |
          Invoke-WebRequest https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile $env:RUNNER_TEMP\ProcessMonitor.zip
          Expand-Archive $env:RUNNER_TEMP\ProcessMonitor.zip -DestinationPath $env:RUNNER_TEMP\procmon
      - name: Audit isolated OpenCode loader test
        run: |
          $procmon = Join-Path $env:RUNNER_TEMP 'procmon\Procmon64.exe'
          $trace = Join-Path $env:RUNNER_TEMP 'opencode-loader-audit.pml'
          $capture = Start-Process -FilePath $procmon -ArgumentList @('/AcceptEula', '/Quiet', '/Minimized', '/BackingFile', $trace) -PassThru
          Start-Sleep -Seconds 2
          $loaderExit = 1
          try {
            mise run "test:loader"
            $loaderExit = $LASTEXITCODE
          } finally {
            & $procmon /Terminate
            $capture.WaitForExit(30000)
          }
          if (-not (Test-Path -LiteralPath $trace)) { throw 'Procmon did not produce a loader audit trace.' }
          if ($loaderExit -ne 0) { exit $loaderExit }
      - name: Upload loader audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-audit
          path: ${{ runner.temp }}/opencode-loader-audit.pml
          if-no-files-found: error
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-coverage
          path: packages/opencode-windows-notifications/coverage/lcov.info
          if-no-files-found: error
